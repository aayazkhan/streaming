apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-media-worker
  labels:
    app.kubernetes.io/name: streaming-media-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: streaming-media-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streaming-media-worker
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: media-worker
          image: ghcr.io/example/streaming-media-worker:0.1.0
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: streaming-database, key: jdbc-url } }
            - name: DATABASE_USER
              valueFrom: { secretKeyRef: { name: streaming-database, key: username } }
            - name: DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: streaming-database, key: password } }
            - name: MEDIA_STORAGE_ENDPOINT
              valueFrom: { configMapKeyRef: { name: streaming-api-config, key: media-storage-endpoint } }
            - name: MEDIA_STORAGE_BUCKET
              valueFrom: { configMapKeyRef: { name: streaming-api-config, key: media-storage-bucket } }
            - name: MEDIA_STORAGE_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: streaming-media-storage, key: access-key } }
            - name: MEDIA_STORAGE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: streaming-media-storage, key: secret-key } }
            - name: MEDIA_WORKSPACE
              value: /tmp/streaming-media-worker
            - name: MEDIA_MAX_CONCURRENT_JOBS
              value: "2"
          volumeMounts:
            - name: worker-tmp
              mountPath: /tmp/streaming-media-worker
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "4", memory: 8Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: worker-tmp
          emptyDir: {}
