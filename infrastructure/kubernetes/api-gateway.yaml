apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-api-gateway
  labels:
    app.kubernetes.io/name: streaming-api-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: streaming-api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streaming-api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: ghcr.io/example/streaming-api-gateway:0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: streaming-database, key: jdbc-url } }
            - name: DATABASE_USER
              valueFrom: { secretKeyRef: { name: streaming-database, key: username } }
            - name: DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: streaming-database, key: password } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: streaming-identity, key: jwt-secret } }
            - name: CORS_ORIGINS
              valueFrom: { configMapKeyRef: { name: streaming-api-config, key: cors-origins } }
            - name: CDN_BASE_URL
              valueFrom: { configMapKeyRef: { name: streaming-api-config, key: cdn-base-url } }
            - name: PUBLIC_ASSET_BASE_URL
              valueFrom: { configMapKeyRef: { name: streaming-api-config, key: public-asset-base-url } }
            - name: MEDIA_STORAGE_ENDPOINT
              valueFrom: { configMapKeyRef: { name: streaming-api-config, key: media-storage-endpoint } }
            - name: MEDIA_STORAGE_BUCKET
              valueFrom: { configMapKeyRef: { name: streaming-api-config, key: media-storage-bucket } }
            - name: MEDIA_STORAGE_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: streaming-media-storage, key: access-key } }
            - name: MEDIA_STORAGE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: streaming-media-storage, key: secret-key } }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 1, memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-api-gateway
spec:
  selector:
    app.kubernetes.io/name: streaming-api-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
