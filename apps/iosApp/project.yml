name: StreamingIOS
options:
  bundleIdPrefix: com.streaming.platform
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
targets:
  StreamingIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    dependencies:
      - framework: ../../shared/iosKit/build/XCFrameworks/debug/SharedKit.xcframework
        embed: true
        codeSign: true
    info:
      path: Generated-Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
